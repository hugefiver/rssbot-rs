name: Build Docker

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build image for"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      amd64_version:
        description: "Override amd64 version"
        required: false
        type: string
      tags:
        description: "Override image tag"
        required: false
        type: string
        default: "latest"
  workflow_call:
    inputs:
      platform:
        description: "Build image for"
        required: true
        default: "linux/amd64"
        type: string
      amd64_version:
        description: "Override amd64 version"
        required: false
        type: string
      tags:
        description: "Override image tag"
        required: false
        type: string
        default: "latest"
  push:
    branches:
      - dev
    tags:
      - 'v*.*'

env:
  IMAGE_NAME: rssbot

jobs:
  build-docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        locale: [en, zh]

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Metadata
        id: meta
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}_${{ matrix.locale }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          PLATFORM="linux/amd64"
          [ -n "${{ github.event.inputs.platform }}" ] && PLATFORM="${{ github.event.inputs.platform }}"
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "master" ] && VERSION=latest
          TAGS="$VERSION"
          [ -n "${{ github.event.inputs.tags }}" ] && TAGS="${{ github.event.inputs.tags }}"
          TAGS=$(echo "$TAGS" | tr ',' '\n')
          IMAGE_TAGS=""
          for TAG in $TAGS; do
            if [ -n "$IMAGE_TAGS" ]; then
              IMAGE_TAGS="$IMAGE_TAGS,"
            fi
            IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_ID}:$TAG"
          done
          echo "image=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "image_tags=$IMAGE_TAGS" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Upload
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_tags }}
          labels: runnumber=${{ github.run_id }}
          provenance: false
          platforms: ${{ steps.meta.outputs.platform }}
          cache-from: type=gha,scope=rssbot-${{ matrix.locale }}
          cache-to: type=gha,mode=max,scope=rssbot-${{ matrix.locale }}
          build-args: |
            AMD64_VERSION=${{ github.event.inputs.amd64_version }}
